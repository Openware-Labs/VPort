[workspace]
resolver = "2"
members = ["protocol/vport-proto", "lib/libvport", "programs/vportd", "programs/vport-gateway"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Openware-Labs/VPort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
